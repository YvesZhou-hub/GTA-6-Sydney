      - name: Run aerial arsenal QA from the exact extracted release EXE
        shell: python
        run: |
          import datetime, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          package = base / 'package/Harbourlife'
          child_env = dict(os.environ)
          child_env['APPDATA'] = str(base / 'arsenal-user/roaming')
          child_env['LOCALAPPDATA'] = str(base / 'arsenal-user/local')
          for key in ('APPDATA', 'LOCALAPPDATA'):
              Path(child_env[key]).mkdir(parents=True, exist_ok=False)
          # Observe the actual known-folder location as well as the requested
          # process-local redirect, matching the driving report isolation guard.
          user_roots = {Path(os.environ['APPDATA']) / 'Godot/app_userdata',
                        Path(child_env['APPDATA']) / 'Godot/app_userdata'}
          def arsenal_reports():
              return sorted({p.resolve() for folder in user_roots
                             for p in folder.glob('*/arsenal-qa/report.json') if p.is_file()})
          result = {'passed': False, 'timed_out': False, 'exit_code': None,
                    'fixed_physics_hz': 60, 'wall_timeout_seconds': 300,
                    'started_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'scope': 'Production exported Windows full-city arsenal integration: real module purchases, tank blast damage feedback, aerial enemy pursuit and telegraphs, physical evasion and wall protection, purchased support weapons and veteran progression. Controlled scenario actor placement is disclosed; headless, no GPU or human-input claim.'}
          started_ns = time.time_ns()
          try:
              if arsenal_reports():
                  raise RuntimeError('An arsenal report already exists before this run; refusing stale evidence.')
              log_names = ('arsenal-engine.log', 'arsenal-stdout.log', 'arsenal-stderr.log')
              if any((evidence / name).exists() for name in (*log_names, 'arsenal-report.json')):
                  raise RuntimeError('Arsenal logs and collected report must be fresh for this run.')
              with (evidence / 'arsenal-stdout.log').open('wb') as stdout, (evidence / 'arsenal-stderr.log').open('wb') as stderr:
                  completed = subprocess.run(
                      [str(package / 'Harbourlife.exe'), '--headless', '--fixed-fps', '60',
                       '--log-file', str(evidence / 'arsenal-engine.log'), '--', '--arsenal-qa'],
                      cwd=package, env=child_env, stdout=stdout, stderr=stderr,
                      timeout=300, check=False)
              result['exit_code'] = completed.returncode
              if completed.returncode != 0:
                  raise RuntimeError('Arsenal QA EXE did not exit zero.')
              reports = arsenal_reports()
              if len(reports) != 1:
                  raise RuntimeError(f'Expected one fresh arsenal report in observed Windows user directories; found {len(reports)}.')
              original = reports[0]
              result['report_original_path'] = str(original)
              result['observed_user_data_directory'] = str(original.parent.parent)
              result['report_fresh'] = original.stat().st_mtime_ns >= started_ns - 1_000_000_000
              if not result['report_fresh']:
                  raise RuntimeError('Arsenal report timestamp predates this process.')
              shutil.copy2(original, evidence / 'arsenal-report.json')
              result['passed'] = True
          except subprocess.TimeoutExpired:
              result['timed_out'] = True
              result['error'] = 'Arsenal QA exceeded 300 seconds; subprocess terminated and waited.'
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'
          finally:
              result['finished_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              (evidence / 'arsenal-process.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          if not result['passed']:
              sys.exit(result.get('error', 'Arsenal QA failed'))

