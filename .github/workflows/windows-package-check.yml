      - name: Keep the package and verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-package-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QA_ROOT }}/evidence/
            dist/windows/Harbourlife-Windows-x86_64.zip
            reports/windows-build.json
            reports/windows-export-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload only verified files to the exact-commit release without publishing it
        if: ${{ success() && inputs.publish }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          report_path = evidence / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if not report['passed']:
              raise RuntimeError('Refusing to publish a failed Windows check')
          package = report['package']
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          output = root / 'dist/windows'
          archive = output / 'Harbourlife-Windows-x86_64.zip'
          if digest(archive) != package['archive_sha256']:
              raise RuntimeError('ZIP changed after runtime validation')
          # Publish a report with portable paths; keep original runner logs in the Actions artifact.
          def portable(value):
              if isinstance(value, str):
                  for old, replacement in ((str(base), '${QA_TEMP}'), (str(root), '${PROJECT}')):
                      value = value.replace(old, replacement).replace(old.replace('\\', '/'), replacement)
                  return value
              if isinstance(value, dict):
                  return {portable(k): portable(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [portable(v) for v in value]
              return value
          validation = output / 'windows-validation.json'
          validation.write_text(json.dumps(portable(report), indent=2) + '\n', encoding='utf-8')
          sums = output / 'Windows-SHA256SUMS.txt'
          sums.write_text(''.join(digest(p) + '  ' + p.name + '\n' for p in (archive, validation)), encoding='utf-8')
          files = [archive, validation, sums]
          tag, repo = os.environ['RELEASE_TAG'], os.environ['GITHUB_REPOSITORY']
          commit = package.get('build', {}).get('source_commit', '')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or commit != os.environ['GITHUB_SHA']
                  or package.get('release_tag') != tag or package.get('repository') != repo):
              raise RuntimeError('Validated package must match the requested tag, repository and exact dispatched commit')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--repo', repo,
                                                      '--json', 'tagName,isDraft,targetCommitish,assets'], text=True))
          if (release['tagName'] != tag or release.get('targetCommitish') != commit
                  or not isinstance(release.get('isDraft'), bool)):
              raise RuntimeError('Release must use the specified tag and full source commit, not a floating branch')
          # A draft may not create its Git tag until publication. Existing tags must
          # still resolve to this commit, including annotated tags; never retarget one.
          refs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/matching-refs/tags/{tag}'], text=True))
          refs = [ref for ref in refs if ref.get('ref') == 'refs/tags/' + tag]
          if len(refs) > 1 or (not refs and not release['isDraft']):
              raise RuntimeError('Published release must have exactly one matching Git tag')
          if refs:
              obj = refs[0]['object']
              for _ in range(8):
                  if obj.get('type') != 'tag':
                      break
                  obj = json.loads(subprocess.check_output(
                      ['gh', 'api', f'repos/{repo}/git/tags/{obj["sha"]}'], text=True))['object']
              if obj.get('type') != 'commit' or obj.get('sha') != commit:
                  raise RuntimeError('Existing Git tag does not resolve to the validated source commit')
          existing = {asset['name'] for asset in release['assets']}
          missing = []
          # Preflight every same-name asset before uploading anything. Never use --clobber.
          for path in files:
              if path.name not in existing:
                  missing.append(path)
                  continue
              with tempfile.TemporaryDirectory(prefix='existing-release-', dir=base) as tmp:
                  subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--pattern', path.name,
                                  '--dir', tmp], check=True)
                  if digest(Path(tmp) / path.name) != digest(path):
                      raise RuntimeError('Existing release asset differs; refusing replacement: ' + path.name)
          if missing:
              subprocess.run(['gh', 'release', 'upload', tag, '--repo', repo, *map(str, missing)], check=True)
          print('WINDOWS_RELEASE_ASSETS_VERIFIED', tag, commit, 'draft=' + str(release['isDraft']), ', '.join(p.name for p in files))
