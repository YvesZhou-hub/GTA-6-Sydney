name: Build and check Windows release

# Manual Windows CPU/runtime validation. No GPU or human-input claim.
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft or published release pinned to this exact source commit
        required: true
        default: v0.5.0-preview.1
        type: string
      publish:
        description: Upload only after validation; never replace a different existing asset
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-check-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      PYTHONUTF8: '1'
    steps:
      - name: Preserve committed LF bytes on the disposable runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          $qa = Join-Path $env:RUNNER_TEMP "harbourlife-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "QA_ROOT=$qa" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout the dispatched commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download and verify official Godot 4.7.2 tools
        shell: python
        run: |
          import hashlib, json, os, shutil, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          evidence.mkdir(parents=True, exist_ok=False)
          tools = base / 'tools'
          tools.mkdir()
          installed = Path(os.environ['APPDATA']) / 'Godot/export_templates/4.7.2.stable'
          installed.mkdir(parents=True, exist_ok=True)
          sources = {
              'Godot_v4.7.2-stable_win64.exe.zip': '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953',
              'Godot_v4.7.2-stable_export_templates.tpz': 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011',
          }
          records = {}
          for name, expected in sources.items():
              url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/' + name
              target = tools / name
              request = urllib.request.Request(url, headers={'User-Agent': 'Harbourlife-Windows-CI'})
              with urllib.request.urlopen(request, timeout=180) as response, target.open('wb') as output:
                  shutil.copyfileobj(response, output)
              with target.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              records[name] = {'url': url, 'sha256': actual, 'expected_sha256': expected, 'bytes': target.stat().st_size}
              (evidence / 'official-tools.json').write_text(json.dumps(records, indent=2) + '\n', encoding='utf-8')
              if actual != expected:
                  raise RuntimeError('Official download SHA256 mismatch: ' + name)
              with zipfile.ZipFile(target) as archive:
                  if archive.testzip() is not None:
                      raise RuntimeError('Official archive CRC mismatch: ' + name)
                  if name.endswith('.tpz'):
                      relevant = [n for n in archive.namelist()
                                  if 'windows' in n.lower() or 'd3d12' in n.lower() or n.lower().endswith('.dll')]
                      records[name]['windows_and_auxiliary_entries'] = relevant
                      records[name]['uncompressed_bytes'] = sum(e.file_size for e in archive.infolist())
                      print('OFFICIAL_WINDOWS_TEMPLATE_ENTRIES', json.dumps(relevant))
                      # Install the complete official templates tree exactly once, including
                      # any auxiliary files present in the verified official distribution.
                      for entry in archive.infolist():
                          parts = PurePosixPath(entry.filename).parts
                          if not parts or parts[0] != 'templates' or '..' in parts or '\\' in entry.filename:
                              raise RuntimeError('Unexpected official template member: ' + entry.filename)
                          destination = installed.joinpath(*parts[1:])
                          if entry.is_dir():
                              destination.mkdir(parents=True, exist_ok=True)
                          else:
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              with archive.open(entry) as src, destination.open('wb') as dst:
                                  shutil.copyfileobj(src, dst)
                  else:
                      for member in archive.namelist():
                          if PurePosixPath(member).name != member or not member.lower().endswith('.exe'):
                              raise RuntimeError('Unexpected official editor member: ' + member)
                          archive.extract(member, tools)
              (evidence / 'official-tools.json').write_text(json.dumps(records, indent=2) + '\n', encoding='utf-8')
              target.unlink()  # Only our verified temporary download; avoid duplicate multi-GB storage.
          if (installed / 'version.txt').read_text().strip() != '4.7.2.stable':
              raise RuntimeError('Wrong installed export template version')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write('GODOT_ENGINE=' + str(tools / 'Godot_v4.7.2-stable_win64_console.exe') + '\n')
              env.write('GODOT_TEMPLATES=' + str(installed) + '\n')

      - name: Build the unchanged game sources for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:QA_ROOT 'evidence/build.log'
          python tools/build_windows.py --engine "$env:GODOT_ENGINE" --templates "$env:GODOT_TEMPLATES" `
            --output dist/windows --report reports/windows-build.json 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed.' }

      - name: Verify build identity and extract the exact ZIP for execution
        shell: python
        run: |
          import hashlib, json, os, re, stat, struct, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          report = {'passed': False, 'checks': {}, 'release_tag': os.environ['RELEASE_TAG'],
                    'asset_name': 'Harbourlife-Windows-x86_64.zip', 'repository': os.environ['GITHUB_REPOSITORY'],
                    'workflow_sha': os.environ['WORKFLOW_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          def check(name, condition):
              report['checks'][name] = bool(condition)
              if not condition:
                  raise RuntimeError(name)
          try:
              check('valid_tag', bool(re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?', report['release_tag'])))
              manifest_path = root / 'reports/windows-build.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              check('release_tag_matches_game', manifest['game_release'] == report['release_tag'])
              report['build_manifest_sha256'] = digest(manifest_path)
              report['build'] = manifest
              commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              check('build_source_commit', manifest['source_commit'] == commit)
              check('dispatched_commit_matches', commit == os.environ['GITHUB_SHA'])
              current_sources = {str(p.relative_to(root)).replace('\\', '/'): digest(p) for p in sorted((root / 'game').rglob('*'))
                                 if p.is_file() and '.godot' not in p.parts}
              check('game_sources_match_build', current_sources == manifest['source_sha256'])
              game_version = manifest['game_version']
              check('numeric_game_version', bool(re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', game_version)))
              expected_reference = f'docs/evidence/v{game_version.replace(".", "")}-app/build.json'
              check('source_reference_matches_game_version', manifest['source_reference'] == expected_reference)
              baseline_path = root / expected_reference
              baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
              report['source_baseline_sha256'] = digest(baseline_path)
              report['source_file_count'] = len(current_sources)
              check('source_reference_hash_matches_build', report['source_baseline_sha256'] == manifest['source_reference_sha256'])
              check('all_game_files_match_macos_build', bool(current_sources)
                    and len(current_sources) == manifest['source_file_count']
                    and current_sources == baseline['source_sha256'])
              check('same_engine_as_macos_build', manifest['engine'] == baseline['engine'])
              archive = root / 'dist/windows' / report['asset_name']
              report['archive_sha256'] = digest(archive)
              check('zip_matches_build_hash', report['archive_sha256'] == manifest['archive_sha256'])
              extracted = base / 'package'
              extracted.mkdir()
              with zipfile.ZipFile(archive) as package:
                  entries = package.infolist()
                  names = [entry.filename for entry in entries]
                  check('unique_zip_paths', len(names) == len(set(n.casefold() for n in names)))
                  check('bounded_uncompressed_size', sum(e.file_size for e in entries) < 2 * 1024**3)
                  for entry in entries:
                      path = PurePosixPath(entry.filename)
                      check('safe_zip_paths', not path.is_absolute() and '\\' not in entry.filename
                            and bool(path.parts) and path.parts[0] == 'Harbourlife'
                            and all(part not in ('..', '.') and ':' not in part and not part.endswith((' ', '.')) for part in path.parts)
                            and not stat.S_ISLNK(entry.external_attr >> 16))
                  check('zip_crc', package.testzip() is None)
                  package.extractall(extracted)
              exe = extracted / 'Harbourlife/Harbourlife.exe'
              pck = extracted / 'Harbourlife/Harbourlife.pck'
              check('expected_exe_and_external_pck', exe.is_file() and pck.is_file())
              check('single_external_pck', list(extracted.rglob('*.pck')) == [pck])
              data = exe.read_bytes()
              check('dos_header', len(data) >= 64 and data[:2] == b'MZ')
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              check('pe_header_bounds', offset + 26 <= len(data))
              check('pe_signature', data[offset:offset + 4] == b'PE\0\0')
              machine = struct.unpack_from('<H', data, offset + 4)[0]
              magic = struct.unpack_from('<H', data, offset + 24)[0]
              check('pe_amd64_pe32plus', machine == 0x8664 and magic == 0x20b)
              report['pe_machine'] = hex(machine)
              report['app_identity'] = {'executable_sha256': digest(exe), 'pck_sha256': digest(pck)}
              check('extracted_exe_and_pck_match_build', report['app_identity'] == manifest['app_identity'])
              with pck.open('rb') as stream:
                  header = stream.read(20)
              check('godot_pck_header', len(header) == 20 and header[:4] == b'GDPC')
              report['pck_header'] = dict(zip(('format', 'engine_major', 'engine_minor', 'engine_patch'), struct.unpack('<4I', header[4:])))
              report['passed'] = True
          except Exception as exc:
              report['error'] = f'{type(exc).__name__}: {exc}'
          finally:
              (evidence / 'package.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if not report['passed']:
              sys.exit(report.get('error', 'Package validation failed'))

      - name: Run the actual exported EXE and wait for termination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:QA_ROOT 'evidence'
          $package = Join-Path $env:QA_ROOT 'package/Harbourlife'
          $exe = Join-Path $package 'Harbourlife.exe'
          $runtime = Join-Path $evidence 'engine.log'
          $stdout = Join-Path $evidence 'stdout.log'
          $stderr = Join-Path $evidence 'stderr.log'
          # These process-local directories are fresh runner scratch, never user data.
          $env:APPDATA = Join-Path $env:QA_ROOT 'isolated-user/roaming'
          $env:LOCALAPPDATA = Join-Path $env:QA_ROOT 'isolated-user/local'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $result = @{ passed = $false; timed_out = $false; exit_code = $null; iterations = 15;
            scope = 'Headless CPU/runtime boot of the release EXE; no GPU, audio listening or manual input test.';
            started_utc = [DateTime]::UtcNow.ToString('o') }
          try {
            if (Test-Path $runtime) { throw 'Engine log must not exist before this run.' }
            # Start-Process joins ArgumentList; explicitly quote the possibly spaced log path.
            $arguments = @('--headless', '--quit-after', '15', '--log-file', ('"' + $runtime + '"'), '--', '--interactive-qa')
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $package -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(300000)) {
              $result.timed_out = $true
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
              throw 'Exported EXE exceeded the 300-second wall-clock limit.'
            }
            # Wait again to ensure redirected output handles have fully drained.
            $process.WaitForExit()
            $result.exit_code = $process.ExitCode
            $result.passed = ($process.ExitCode -eq 0)
          } catch {
            $result.error = $_.Exception.Message
          } finally {
            $result.finished_utc = [DateTime]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $evidence 'process.json')
          }
          if (-not $result.passed) { throw 'Exported EXE did not exit successfully; see process.json.' }

      - name: Run driving physics QA from the exact extracted release EXE
        shell: python
        run: |
          import datetime, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          package = base / 'package/Harbourlife'
          child_env = dict(os.environ)
          child_env['APPDATA'] = str(base / 'driving-user/roaming')
          child_env['LOCALAPPDATA'] = str(base / 'driving-user/local')
          for key in ('APPDATA', 'LOCALAPPDATA'):
              Path(child_env[key]).mkdir(parents=True, exist_ok=False)
          # Godot may resolve the Windows known folder rather than the overridden
          # environment variable. Observe both fresh runner locations; never assume
          # the redirect worked, and never delete or overwrite a pre-existing report.
          user_roots = {Path(os.environ['APPDATA']) / 'Godot/app_userdata',
                        Path(child_env['APPDATA']) / 'Godot/app_userdata'}
          def driving_reports():
              return sorted({p.resolve() for folder in user_roots
                             for p in folder.glob('*/driving-qa/report.json') if p.is_file()})
          result = {'passed': False, 'timed_out': False, 'exit_code': None,
                    'fixed_physics_hz': 60, 'wall_timeout_seconds': 300,
                    'started_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'scope': 'Production exported Windows vehicle physics with bound input actions; headless, no GPU or manual-driving claim.'}
          started_ns = time.time_ns()
          try:
              if driving_reports():
                  raise RuntimeError('A driving report already exists before this run; refusing stale evidence.')
              log_names = ('driving-engine.log', 'driving-stdout.log', 'driving-stderr.log')
              if any((evidence / name).exists() for name in log_names):
                  raise RuntimeError('Driving logs must be fresh for this run.')
              with (evidence / 'driving-stdout.log').open('wb') as stdout, (evidence / 'driving-stderr.log').open('wb') as stderr:
                  completed = subprocess.run(
                      [str(package / 'Harbourlife.exe'), '--headless', '--fixed-fps', '60',
                       '--log-file', str(evidence / 'driving-engine.log'), '--', '--driving-qa'],
                      cwd=package, env=child_env, stdout=stdout, stderr=stderr,
                      timeout=300, check=False)
              result['exit_code'] = completed.returncode
              if completed.returncode != 0:
                  raise RuntimeError('Driving QA EXE did not exit zero.')
              reports = driving_reports()
              if len(reports) != 1:
                  raise RuntimeError(f'Expected one fresh driving report in observed Windows user directories; found {len(reports)}.')
              original = reports[0]
              result['report_original_path'] = str(original)
              result['observed_user_data_directory'] = str(original.parent.parent)
              result['report_fresh'] = original.stat().st_mtime_ns >= started_ns - 1_000_000_000
              if not result['report_fresh']:
                  raise RuntimeError('Driving report timestamp predates this process.')
              shutil.copy2(original, evidence / 'driving-report.json')
              result['passed'] = True
          except subprocess.TimeoutExpired:
              result['timed_out'] = True
              result['error'] = 'Driving QA exceeded 300 seconds; subprocess terminated and waited.'
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'
          finally:
              result['finished_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              (evidence / 'driving-process.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          if not result['passed']:
              sys.exit(result.get('error', 'Driving QA failed'))

      - name: Run survival integration QA from the exact extracted release EXE
        shell: python
        run: |
          import datetime, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          base = Path(os.environ['QA_ROOT'])
          evidence = base / 'evidence'
          package = base / 'package/Harbourlife'
          child_env = dict(os.environ)
          child_env['APPDATA'] = str(base / 'survival-user/roaming')
          child_env['LOCALAPPDATA'] = str(base / 'survival-user/local')
          for key in ('APPDATA', 'LOCALAPPDATA'):
              Path(child_env[key]).mkdir(parents=True, exist_ok=False)
          # Observe the actual known-folder location as well as the requested
          # process-local redirect, matching the driving report isolation guard.
          user_roots = {Path(os.environ['APPDATA']) / 'Godot/app_userdata',
                        Path(child_env['APPDATA']) / 'Godot/app_userdata'}
          def survival_reports():
              return sorted({p.resolve() for folder in user_roots
                             for p in folder.glob('*/survival-qa/report.json') if p.is_file()})
          result = {'passed': False, 'timed_out': False, 'exit_code': None,
                    'fixed_physics_hz': 60, 'wall_timeout_seconds': 300,
                    'started_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'scope': 'Production exported Windows survival integration in the full city, including physical H/B input, enemy damage, tank projectile rewards and paid repair; headless, no native rendering claim.'}
          started_ns = time.time_ns()
          try:
              if survival_reports():
                  raise RuntimeError('A survival report already exists before this run; refusing stale evidence.')
              log_names = ('survival-engine.log', 'survival-stdout.log', 'survival-stderr.log')
              if any((evidence / name).exists() for name in (*log_names, 'survival-report.json')):
                  raise RuntimeError('Survival logs and collected report must be fresh for this run.')
              with (evidence / 'survival-stdout.log').open('wb') as stdout, (evidence / 'survival-stderr.log').open('wb') as stderr:
                  completed = subprocess.run(
                      [str(package / 'Harbourlife.exe'), '--headless', '--fixed-fps', '60',
                       '--log-file', str(evidence / 'survival-engine.log'), '--', '--survival-qa'],
                      cwd=package, env=child_env, stdout=stdout, stderr=stderr,
                      timeout=300, check=False)
              result['exit_code'] = completed.returncode
              if completed.returncode != 0:
                  raise RuntimeError('Survival QA EXE did not exit zero.')
              reports = survival_reports()
              if len(reports) != 1:
                  raise RuntimeError(f'Expected one fresh survival report in observed Windows user directories; found {len(reports)}.')
              original = reports[0]
              result['report_original_path'] = str(original)
              result['observed_user_data_directory'] = str(original.parent.parent)
              result['report_fresh'] = original.stat().st_mtime_ns >= started_ns - 1_000_000_000
              if not result['report_fresh']:
                  raise RuntimeError('Survival report timestamp predates this process.')
              shutil.copy2(original, evidence / 'survival-report.json')
              result['passed'] = True
          except subprocess.TimeoutExpired:
              result['timed_out'] = True
              result['error'] = 'Survival QA exceeded 300 seconds; subprocess terminated and waited.'
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'
          finally:
              result['finished_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              (evidence / 'survival-process.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          if not result['passed']:
              sys.exit(result.get('error', 'Survival QA failed'))

