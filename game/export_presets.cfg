[preset.0]
name="macOS Local"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="*.md,*.log,export_presets.cfg"
export_path="../dist/Harbourlife.app"
script_export_mode=2

[preset.0.options]
export/distribution_type=0
binary_format/architecture="universal"
application/liquid_glass_icon=""
application/icon="res://assets/icon.svg"
application/bundle_identifier="local.yveszhou.harbourlife"
application/app_category="Games"
application/short_version="0.1.4"
application/version="0.1.4"
application/copyright="Harbourlife local development build, 2026"
application/min_macos_version_arm64="13.00"
shader_baker/enabled=false
codesign/codesign=1
notarization/notarization=0
custom_template/debug="../tools/runtime/templates/macos.zip"
custom_template/release="../tools/runtime/templates/macos.zip"
display/high_res=true
